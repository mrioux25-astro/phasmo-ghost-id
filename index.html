<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ghost ID Wizard</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e13;color:#f5f7fa;margin:0;padding:24px}.card{max-width:560px;margin:0 auto;background:#151a22;border:1px solid #293140;border-radius:18px;padding:24px}button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:12px;font-size:17px;font-weight:700;background:#dfe7f5;color:#10141b}.secondary{background:#293140;color:#fff}.muted{color:#aeb8c8}.hidden{display:none}.pill{display:inline-block;background:#252d39;padding:6px 10px;border-radius:999px;font-size:13px}.result{font-size:28px;font-weight:800}</style></head><body><main class="card"><div class="pill">Phasmophobia • zero-evidence helper</div><h1>👻 Ghost ID Wizard</h1><section id="home"><p class="muted">Answer one observation at a time. You can always choose “Couldn’t tell.” No GPT or API is used.</p><button id="start">Start New Investigation</button></section><section id="quiz" class="hidden"><p id="count" class="muted"></p><h2 id="question"></h2><div id="answers"></div><button id="undo" class="secondary">Undo Last Answer</button><button id="guess" class="secondary">Show Best Guess</button></section><section id="results" class="hidden"><p class="muted">Most likely</p><div id="ghost" class="result"></div><p id="why"></p><p><strong>Next test:</strong> <span id="test"></span></p><button id="restart">New Investigation</button></section></main><script>const ghosts=["Spirit","Wraith","Phantom","Poltergeist","Banshee","Jinn","Mare","Revenant","Shade","Demon","Yurei","Oni","Yokai","Hantu","Goryo","Myling","Onryo","The Twins","Raiju","Obake","The Mimic","Moroi","Deogen","Thaye","Dayan","Gallu","Obambo","Kormos","Aswang","Deildegast"];const qs=[{q:"During a hunt, was it dramatically slow while searching but suddenly extremely fast after detecting a player?",a:{yes:["Revenant"],no:[],unknown:[]}},{q:"During a hunt, did it become extremely slow when it got very close to a player?",a:{yes:["Deogen"],no:[],unknown:[]}},{q:"Did the ghost noticeably speed up near active electronic equipment during a hunt?",a:{yes:["Raiju"],no:[],unknown:[]}},{q:"Did it refuse to step in salt?",a:{yes:["Wraith"],no:[],unknown:[]}},{q:"Did you see the ghost visibly change its model during a hunt?",a:{yes:["Obake"],no:[],unknown:[]}},{q:"Did its hunt speed seem strongly dependent on room temperature rather than line of sight?",a:{yes:["Hantu"],no:[],unknown:[]}},{q:"Did it start very fast/aggressive early in the contract and become slower/calmer later?",a:{yes:["Thaye"],no:[],unknown:[]}},{q:"Did its speed change depending on whether a nearby player was moving or standing still?",a:{yes:["Dayan"],no:[],unknown:[]}},{q:"Did it seem unusually sensitive to player footsteps/sprinting but poor at seeing players from farther away?",a:{yes:["Kormos"],no:[],unknown:[]}},{q:"Did moving objects around the location seem to progressively slow the ghost?",a:{yes:["Deildegast"],no:[],unknown:[]}},{q:"Did you observe an unusually long invisible period between blinks during a hunt?",a:{yes:["Phantom"],no:[],unknown:[]}},{q:"Was the ghost unusually visible during hunts with very short invisible blink periods?",a:{yes:["Oni"],no:[],unknown:[]}},{q:"Did it throw multiple nearby objects at essentially the same time?",a:{yes:["Poltergeist"],no:[],unknown:[]}},{q:"Did you hear a distinctive scream through the parabolic microphone?",a:{yes:["Banshee"],no:[],unknown:[]}},{q:"Did it hunt unusually early or seem able to hunt at very high sanity?",a:{yes:["Demon"],no:[],unknown:[]}},{q:"Did it show two distinct hunt speeds on different hunts?",a:{yes:["The Twins","Obambo"],no:[],unknown:[]}},{q:"Did the ghost become faster as team sanity became lower?",a:{yes:["Moroi"],no:[],unknown:[]}},{q:"Did it behave like another ghost's distinctive ability but you also have suspicious extra Ghost Orbs?",a:{yes:["The Mimic"],no:[],unknown:[]}}];let i=0,scores={},history=[];function reset(){i=0;scores=Object.fromEntries(ghosts.map(g=>[g,0]));history=[];document.getElementById('home').classList.add('hidden');document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}function render(){if(i>=qs.length)return show();document.getElementById('count').textContent=`Question ${i+1} of ${qs.length}`;document.getElementById('question').textContent=qs[i].q;let a=document.getElementById('answers');a.innerHTML='';[['Yes','yes'],['No','no'],["Couldn't tell / didn't test",'unknown']].forEach(([t,v])=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>answer(v);a.appendChild(b)})}function answer(v){history.push({i,scores:{...scores}});if(v==='yes')qs[i].a.yes.forEach(g=>scores[g]=(scores[g]||0)+10);else if(v==='no')qs[i].a.yes.forEach(g=>scores[g]=(scores[g]||0)-2);i++;render()}function show(){let ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);let top=ranked[0];document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('ghost').textContent=top[1]>0?top[0]:'Not enough information yet';document.getElementById('why').textContent=top[1]>0?'Your answers most strongly match this ghost. Keep The Mimic in mind when a special behavior is the main clue.':'Try another hunt and focus on speed, line-of-sight behavior, electronics, salt, blinking, and special abilities.';document.getElementById('test').textContent=top[1]>0?'Repeat the distinctive behavior once more, then use any available evidence to rule out The Mimic.':'Observe one hunt and answer the speed questions first.'}document.getElementById('start').addEventListener('click',reset);document.getElementById('restart').addEventListener('click',reset);document.getElementById('guess').addEventListener('click',show);document.getElementById('undo').addEventListener('click',()=>{let h=history.pop();if(!h)return;i=h.i;scores=h.scores;render()});</script></body></html>
